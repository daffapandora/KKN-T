upstream web_upstream {
    server web:80;
}

upstream api_upstream {
    server api:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost dev.desakemitir.id;

    # Security Headers (Section 10)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # 1. API Health Check
    location /health {
        proxy_pass http://api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Strict Rate Limiting for Report Submissions (Section 4)
    location /api/v1/reports {
        limit_req zone=reports_limit burst=5 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. General REST API
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend WebGIS and PWA Static Assets
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Immutable Static Asset Cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|pbf)$ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
